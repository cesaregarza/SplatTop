[project]
name = "splat_top"
version = "0.2.0"
description = ""
authors = [{ name = "Cesar E Garza", email = "cesar@cegarza.com" }]
requires-python = ">=3.12, <3.14"
readme = "README.md"
dependencies = [
    "sqlalchemy>=2.0.51,<2.1",
    "psycopg2-binary>=2.9.12,<3",
    "python-dotenv>=1.2.2,<2",
    "celery[redis]>=5.6.3,<5.7",
    "redis>=6.4.0,<6.5",
    "fastapi>=0.141.1,<0.142",
    "starlette>=1.4.1,<1.5",
    "pydantic>=2.13.4,<2.14",
    "uvicorn[standard]>=0.52.1,<0.53",
    "uvicorn-worker>=0.4.0,<0.5",
    "asyncpg>=0.31.0,<0.32",
    "pandas>=3.0.5,<3.1",
    "orjson>=3.11.9,<4",
    "slowapi>=0.1.10,<0.2",
    "gunicorn>=26.0.0,<27",
    "scipy>=1.18.0,<1.19",
    "cachetools>=7.1.7,<8",
    "httpx>=0.28.1,<0.29",
    "itsdangerous>=2.2.0,<3",
    "requests>=2.34.2,<3",
    "numpy>=2.5.1,<2.6",
    "prometheus-client>=0.26.0,<1",
    "htpasswd>=2.3",
    "pillow>=12.3.0,<13",
]

[project.scripts]
run_dev = "fast_api_app.app:run_dev"

[dependency-groups]
dev = [
    "black>=26.5.1,<27",
    "isort>=8.0.1,<9",
    "pytest>=9.1.1,<10",
    "httpx2>=2.9.1,<3",
]
scripts = [
    "boto3>=1.43.66,<2",
    "tqdm>=4.70.0,<5",
    "locust>=2.46.3,<3",
    "ruamel.yaml>=0.19.1,<0.20",
]

[tool.uv]
default-groups = [
    "dev",
    "scripts",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/fast_api_app",
    "src/celery_app",
    "src/shared_lib",
]

[tool.hatch.build.targets.wheel]
include = [
    "src/fast_api_app",
    "src/celery_app",
    "src/shared_lib",
]

[tool.hatch.build.targets.wheel.sources]
"src/fast_api_app" = "fast_api_app"
"src/celery_app" = "celery_app"
"src/shared_lib" = "shared_lib"

[build-system]
requires = ["hatchling>=1.31.0,<2"]
build-backend = "hatchling.build"

[tool.black]
line-length = 80
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 80

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
