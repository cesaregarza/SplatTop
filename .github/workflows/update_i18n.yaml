name: Build and Update i18n

on:
  push:
    branches:
      - main
    paths:
      - "i18n/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  i18n:
    runs-on: ubuntu-latest
    environment: SplatTop
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ github.token }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Check if push is from GitHub Actions
        id: check_ci_step
        run: |
          LAST_COMMITTER=$(git log -1 --pretty=format:'%an')
          if [ "$LAST_COMMITTER" = "GitHub Actions" ]; then
            exit 0
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.2"
          enable-cache: false

      - name: Install script dependencies
        run: uv sync --frozen --no-default-groups --group scripts --no-install-project

      - name: Set script permissions
        run: |
          chmod +x scripts/i18n.py

      - name: List scripts directory contents
        run: ls -R scripts

      - name: Run i18n script
        env:
          DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
          DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}
          DO_SPACES_REGION: ${{ secrets.DO_SPACES_REGION }}
          DO_SPACES_ENDPOINT: ${{ secrets.DO_SPACES_ENDPOINT }}
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: uv run --frozen --no-default-groups --group scripts python scripts/i18n.py

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          add-paths: |
            i18n
            src/react_app/public/locales
            src/react_app/src/components/supported_languages.js
            src/react_app/src/i18n.js
          commit-message: "AUTO-I18N: Update i18n files"
          branch: automation/update-i18n
          delete-branch: true
          title: "AUTO-I18N: Update i18n files"
          body: |
            Automated locale refresh generated by `scripts/i18n.py`.
